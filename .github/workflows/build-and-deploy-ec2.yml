name: Build and Deploy Frontend to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || '/api' }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-artifact

      - name: Configure SSH access
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          FRONTEND_DEPLOY_DIR: ${{ vars.FRONTEND_DEPLOY_DIR || '/var/www/hangplan' }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p $FRONTEND_DEPLOY_DIR"
          scp -r frontend-artifact/* "$EC2_USER@$EC2_HOST:$FRONTEND_DEPLOY_DIR/"
